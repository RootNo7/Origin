project:
  name: "Virtual Universe"
  codename: "VEarth"
  type: "artificial-life and persistent-universe simulation"
  status: "initial universe engine specification"
  objective: >
    Create a persistent, internally consistent virtual universe in which
    physical processes, matter, chemistry, environmental systems, time,
    biological systems, and eventually intelligent artificial organisms
    operate continuously according to explicit simulation rules.

  core_principle: >
    The universe exists independently of its artificial intelligence.
    AI agents are inhabitants of the universe rather than controllers of it.

  development_principle:
    - "Do not build the project as a sequence of artificial development phases."
    - "Build the complete first-universe architecture as one coherent system."
    - "Tests, prototypes, benchmarks, scientific validation, and debugging are allowed."
    - "Do not simplify core architecture merely to make the first implementation easier."
    - "Do not create unnecessary enterprise-level abstractions."
    - "Prefer understandable, modular, high-performance engineering."
    - "Every subsystem must have a clear responsibility."
    - "Avoid hard-coded behavior that should emerge from simulation rules."

  long_term_vision: >
    Eventually create an artificial universe capable of supporting autonomous
    artificial organisms that can perceive, learn, experiment, communicate,
    develop concepts, remember experiences, reproduce, and evolve across
    extremely long simulated periods.

# ============================================================
# 1. FUNDAMENTAL DESIGN PHILOSOPHY
# ============================================================

philosophy:

  universe_independence:
    description: >
      The simulation must not depend on an AI being present. The universe
      continues advancing when no AI agent exists.

  emergent_behavior:
    description: >
      High-level behaviors should emerge from lower-level rules whenever
      practical instead of being directly scripted.

  rule_based_world:
    description: >
      Physics, chemistry, environmental behavior, biological processes,
      and other systems must be governed by explicit rules and measurable
      state transitions.

  reproducibility:
    description: >
      The same initial universe state plus the same simulation seed should
      be capable of producing the same simulation when deterministic mode
      is enabled.

  inspectability:
    description: >
      Every important physical, chemical, environmental, and biological
      state should be inspectable for debugging and scientific analysis.

  persistence:
    description: >
      The universe must be able to continue across application restarts.
      Simulation history and state must be serializable.

  scalability:
    description: >
      The architecture must support increasing world size, entity count,
      simulation complexity, and simulation time without requiring a complete
      architectural rewrite.

# ============================================================
# 2. TECHNOLOGY STRATEGY
# ============================================================

technology:

  principle: >
    Do not force every subsystem into one programming language.
    Use the language best suited to the computational responsibility.

  universe_engine:
    language: "C++20 or newer"
    reason:
      - "high performance"
      - "fine-grained memory control"
      - "efficient numerical simulation"
      - "multithreading"
      - "large-scale entity simulation"
      - "mature physics and scientific-computing ecosystem"

  ai_layer:
    language: "Python"
    reason:
      - "machine learning ecosystem"
      - "LLM ecosystem"
      - "rapid experimentation"
      - "scientific computing"
      - "PyTorch compatibility"

  communication:
    preferred:
      - "native C++/Python binding where performance matters"
      - "local IPC or RPC where process isolation is beneficial"
    requirements:
      - "low overhead"
      - "versioned interface"
      - "explicit data contracts"
      - "no hidden global state"

  build_system:
    preferred: "CMake"

  version_control:
    preferred: "Git"

  dependency_policy:
    rules:
      - "Prefer mature, well-maintained libraries."
      - "Do not add dependencies merely for convenience."
      - "Every external dependency must have a documented purpose."
      - "Avoid dependencies that unnecessarily constrain future platforms."
      - "Do not replace core simulation logic with opaque third-party systems."

# ============================================================
# 3. UNIVERSE MODEL
# ============================================================

universe:

  identity:
    description: >
      A universe is a persistent simulation containing space, time, matter,
      energy, physical fields, environments, entities, and eventually life.

  coordinate_system:
    requirements:
      - "well-defined coordinate system"
      - "documented units"
      - "stable numerical representation"
      - "support for large worlds"
      - "avoid unnecessary floating-point instability"

  world_structure:
    hierarchy:
      - "Universe"
      - "Regions"
      - "Worlds / planets"
      - "Environments"
      - "Entities"
      - "Sub-entity physical structures"

  state:
    minimum:
      - "simulation timestamp"
      - "simulation tick"
      - "seed"
      - "physical state"
      - "matter state"
      - "chemical state"
      - "environmental state"
      - "entity state"
      - "event state"

  persistence:
    requirements:
      - "save universe"
      - "load universe"
      - "checkpointing"
      - "crash-safe persistence"
      - "versioned save format"
      - "backward compatibility where practical"

# ============================================================
# 4. TIME SYSTEM
# ============================================================

time:

  objective: >
    Time must be a first-class component of the universe rather than merely
    a frame counter.

  concepts:
    - "simulation time"
    - "ticks"
    - "seconds"
    - "minutes"
    - "hours"
    - "days"
    - "years"
    - "generations"

  requirements:
    - "fixed simulation timestep for deterministic simulation"
    - "optional variable rendering timestep"
    - "simulation speed multiplier"
    - "pause"
    - "single-step simulation"
    - "fast-forward"
    - "slow motion"
    - "long-duration simulation mode"

  long_term:
    description: >
      The architecture must support simulations running for thousands,
      millions, or more simulated years without representing every event
      using a naive one-frame-per-event strategy.

  future_optimization:
    - "adaptive time stepping"
    - "event-driven simulation"
    - "hierarchical temporal resolution"
    - "accelerated simulation for inactive regions"

# ============================================================
# 5. PHYSICS
# ============================================================

physics:

  objective: >
    Create internally consistent physical behavior rather than visually
    convincing scripted motion.

  foundation:
    - "position"
    - "velocity"
    - "acceleration"
    - "mass"
    - "momentum"
    - "force"
    - "energy"
    - "angular motion"
    - "collision"
    - "constraints"

  gravity:
    requirements:
      - "configurable gravitational model"
      - "consistent units"
      - "support multiple gravitational bodies"
      - "stable numerical integration"

  mechanics:
    include:
      - "Newtonian mechanics"
      - "rigid body dynamics"
      - "collision detection"
      - "collision response"
      - "friction"
      - "elasticity"
      - "material-dependent physical properties"

  numerical_methods:
    requirements:
      - "document chosen integrators"
      - "minimize numerical instability"
      - "allow deterministic execution"
      - "provide diagnostics for unstable systems"

  conservation:
    where applicable:
      - "energy"
      - "momentum"
      - "angular momentum"
      - "mass"

  extensibility:
    future:
      - "fluid dynamics"
      - "thermodynamics"
      - "electromagnetism"
      - "relativistic approximations if scientifically justified"
      - "astrophysical systems"

# ============================================================
# 6. MATTER
# ============================================================

matter:

  objective: >
    Represent physical substance in a way that allows chemistry,
    environmental systems, and eventually biology to operate on it.

  hierarchy:
    - "fundamental simulation particles or abstractions"
    - "atoms/elements"
    - "molecules"
    - "materials"
    - "complex structures"

  elements:
    requirements:
      - "element identity"
      - "atomic properties"
      - "mass"
      - "charge"
      - "chemical behavior"
      - "state-dependent behavior"

  states_of_matter:
    initial:
      - "solid"
      - "liquid"
      - "gas"
    future:
      - "plasma"
      - "specialized simulation states"

# ============================================================
# 7. CHEMISTRY
# ============================================================

chemistry:

  objective: >
    Allow matter to interact chemically according to explicit chemical rules
    rather than using scripted game-like crafting recipes.

  concepts:
    - "atoms"
    - "molecules"
    - "bonds"
    - "chemical reactions"
    - "reaction conditions"
    - "temperature"
    - "pressure"
    - "concentration"
    - "energy"

  reactions:
    requirements:
      - "reactants"
      - "products"
      - "reaction conditions"
      - "energy changes"
      - "reaction rates where practical"

  principle:
    description: >
      Chemistry should be capable of producing consequences that were not
      individually scripted as behaviors.

  scalability:
    description: >
      Avoid attempting computationally impossible full quantum chemistry
      everywhere. Use scientifically meaningful abstraction levels while
      preserving coherent emergent behavior.

# ============================================================
# 8. ENVIRONMENT
# ============================================================

environment:

  systems:
    - "terrain"
    - "water"
    - "atmosphere"
    - "temperature"
    - "weather"
    - "climate"
    - "light"
    - "day/night cycle"
    - "seasons"
    - "resources"

  requirements:
    - "environment changes over time"
    - "environment affects organisms"
    - "organisms can affect environment"
    - "resources can be consumed"
    - "resources can regenerate where scientifically appropriate"

  feedback_loops:
    examples:
      - "temperature -> environment -> organisms"
      - "organisms -> environment"
      - "water -> climate -> vegetation"
      - "vegetation -> atmosphere"
      - "resource consumption -> population pressure"

# ============================================================
# 9. BIOLOGY
# ============================================================

biology:

  objective: >
    Eventually support artificial organisms whose behavior emerges from
    physical, biological, informational, and environmental interactions.

  requirements:
    - "energy requirements"
    - "growth"
    - "damage"
    - "healing where applicable"
    - "aging"
    - "death"
    - "reproduction"
    - "inheritance"
    - "mutation"
    - "adaptation"

  organism_model:
    principle: >
      Avoid scripting organisms as collections of if/else behaviors.
      Organisms should have internal state, capabilities, needs,
      perception, memory, and decision-making systems.

# ============================================================
# 10. ARTIFICIAL AGENT
# ============================================================

agent:

  objective: >
    Introduce an AI agent into the universe as an inhabitant that must
    discover the world through experience.

  initial_principle:
    description: >
      The agent receives capabilities but should not receive a complete
      explanation of what those capabilities mean or how they should be
      combined.

  possible_capabilities:
    - "perception"
    - "movement"
    - "object interaction"
    - "memory"
    - "communication"
    - "tool interaction"
    - "construction"
    - "experimentation"
    - "learning"
    - "planning"

  critical_rule:
    do_not_preprogram:
      - "knowledge of physics"
      - "knowledge of chemistry"
      - "knowledge of language"
      - "knowledge of tool purpose"
      - "predefined survival strategies"
      - "predefined civilization"
      - "predefined scientific theories"

  learning:
    principle: >
      The agent should acquire useful knowledge through interaction,
      observation, experimentation, feedback, memory, and experience.

# ============================================================
# 11. AI ARCHITECTURE
# ============================================================

ai:

  principle: >
    Do not assume an LLM alone is sufficient to represent an artificial
    organism.

  components:
    perception:
      responsibility: "convert world state into agent-observable information"

    memory:
      types:
        - "short-term"
        - "episodic"
        - "semantic"
        - "procedural"
        - "long-term"

    world_model:
      responsibility: >
        Maintain an internal representation of the agent's understanding
        of the environment.

    concept_system:
      responsibility: >
        Allow the agent to form and modify concepts rather than relying
        exclusively on predefined categories.

    reasoning:
      possible_technology:
        - "LLM"
        - "neural models"
        - "symbolic reasoning"
        - "planning algorithms"
        - "hybrid methods"

    learning:
      mechanisms:
        - "reinforcement"
        - "self-supervised learning"
        - "experience replay"
        - "experiment-based learning"
        - "future evolutionary learning"

    action:
      responsibility: >
        Convert internal decisions into valid actions supported by the
        universe's capability interface.

# ============================================================
# 12. EXPERIMENTATION
# ============================================================

experimentation:

  objective: >
    The agent should be capable of discovering properties of the universe
    through deliberate experimentation.

  loop:
    - "observe"
    - "identify uncertainty"
    - "form hypothesis"
    - "design experiment"
    - "perform action"
    - "observe result"
    - "compare prediction with result"
    - "update internal model"
    - "store knowledge"

  important_constraint:
    description: >
      The universe must not directly reveal hidden variables to the agent
      unless those variables are legitimately observable.

  example:
    unknown:
      - "gravity constant"
    possible_process:
      - "observe falling objects"
      - "measure trajectories"
      - "repeat experiment"
      - "vary conditions"
      - "infer gravitational behavior"

# ============================================================
# 13. DIGITAL PHYSICS
# ============================================================

digital_physics:

  objective: >
    Make the laws of the simulated universe explicit, configurable,
    inspectable, and eventually capable of supporting alternate universes.

  properties:
    - "gravity parameters"
    - "physical constants"
    - "material properties"
    - "chemical rules"
    - "environmental rules"
    - "time behavior"

  universe_profiles:
    requirement: >
      The engine should eventually permit multiple universe configurations
      without rewriting the simulation engine.

  scientific_integrity:
    rule: >
      Clearly distinguish scientifically established models from deliberately
      fictional or simplified simulation models.

# ============================================================
# 14. CONCEPT FORMATION
# ============================================================

concepts:

  objective: >
    Allow agents to develop internal concepts from repeated observations
    and experiences.

  examples:
    observation:
      - "object falls"
      - "object falls again"
      - "objects fall under similar conditions"

    possible_emergent_concept:
      - "gravity"

  requirements:
    - "concept creation"
    - "concept modification"
    - "concept relationships"
    - "concept confidence"
    - "concept retirement"
    - "concept reuse"

# ============================================================
# 15. SELF-IMPROVEMENT
# ============================================================

self_improvement:

  objective: >
    Eventually allow agents or agent systems to discover better strategies,
    tools, representations, and potentially computational mechanisms.

  safety:
    requirements:
      - "sandbox proposed modifications"
      - "test before activation"
      - "maintain rollback"
      - "record modifications"
      - "never silently modify the host system"

  scope:
    initial:
      - "behavior"
      - "strategies"
      - "learned knowledge"

    future:
      - "tools"
      - "algorithms"
      - "internal representations"
      - "agent architecture"

# ============================================================
# 16. MULTI-AGENT LIFE
# ============================================================

multi_agent:

  objective: >
    Eventually introduce multiple independent artificial organisms into
    the same persistent universe.

  requirements:
    - "independent memory"
    - "independent experience"
    - "communication"
    - "cooperation"
    - "competition"
    - "resource interaction"
    - "social behavior"
    - "knowledge transmission"

  rule:
    description: >
      Agents must share the same universe but should not automatically share
      all knowledge.

# ============================================================
# 17. REPRODUCTION AND EVOLUTION
# ============================================================

evolution:

  objective: >
    Allow populations of artificial organisms to change across generations
    through inheritance, variation, environmental pressure, and selection.

  reproduction:
    requirements:
      - "compatible biological model"
      - "inheritance mechanism"
      - "variation"
      - "offspring"
      - "generation tracking"

  genetics:
    possible_components:
      - "genome"
      - "traits"
      - "mutation"
      - "recombination"
      - "gene expression"

  selection:
    description: >
      Avoid directly selecting which agents should survive. Environmental
      conditions and organism interactions should create selection pressure
      wherever possible.

  evolution:
    objective: >
      Observe whether useful adaptations emerge over long simulated periods.

# ============================================================
# 18. CIVILIZATION
# ============================================================

civilization:

  future_capabilities:
    - "language emergence"
    - "knowledge transmission" 
    - "tool creation" 
    - "tool creation"
    - "resource management"
    - "culture"
    - "social structures"
    - "technology"

  important_rule:
    description: >
      Civilization should not be scripted as a predefined progression.
      If civilization emerges, its path should depend on the simulated
      environment and agent history.

# ============================================================
# 19. EVENT SYSTEM
# ============================================================

events:

  objective: >
    Provide a unified mechanism for significant state changes without
    tightly coupling every subsystem.

  event_examples:
    - "collision"
    - "chemical reaction"
    - "birth"
    - "death"
    - "environmental change"
    - "agent action"
    - "discovery"
    - "mutation"

  requirements:
    - "timestamp"
    - "source"
    - "event type"
    - "payload"
    - "replay/debug support"

# ============================================================
# 20. OBSERVABILITY
# ============================================================

observability:

  requirements:
    - "simulation logs"
    - "metrics"
    - "entity inspection"
    - "physics diagnostics"
    - "chemistry diagnostics"
    - "AI decision tracing"
    - "memory inspection"
    - "experiment history"
    - "evolution history"

  scientific_logging:
    description: >
      Important simulation results must be exportable for analysis.

  replay:
    requirement: >
      Important simulations should be replayable from a known seed and
      recorded state where deterministic execution is enabled.

# ============================================================
# 21. VISUALIZATION
# ============================================================

visualization:

  objective: >
    Provide a visual window into the universe without making rendering
    responsible for simulation logic.

  requirements:
    - "camera"
    - "zoom"
    - "entity visualization"
    - "time controls"
    - "debug overlays"
    - "world inspection"
    - "agent inspection"
    - "simulation statistics"

  principle:
    description: >
      Rendering is a view of the universe, not the universe itself.

# ============================================================
# 22. PERFORMANCE
# ============================================================

performance:

  requirements:
    - "fixed timestep simulation"
    - "multithreading where safe"
    - "spatial partitioning"
    - "efficient memory layout"
    - "avoid unnecessary allocations"
    - "batch processing"
    - "profiling tools"

  scalability_targets:
    conceptual:
      - "thousands of entities"
      - "large physical environments"
      - "long simulations"
      - "multiple agents"

  important:
    description: >
      Do not optimize blindly. Profile first, then optimize actual
      bottlenecks.

# ============================================================
# 23. DETERMINISM
# ============================================================

determinism:

  requirements:
    - "seeded random number generation"
    - "deterministic simulation mode"
    - "controlled execution order where required"
    - "recordable random streams"

  purpose:
    - "debugging"
    - "scientific experiments"
    - "reproducibility"
    - "comparing AI behavior"

# ============================================================
# 24. TESTING
# ============================================================

testing:

  principle: >
    Tests are part of the engineering process and are allowed at any time.
    They do not constitute artificial development phases.

  categories:
    unit:
      - "physics equations"
      - "time"
      - "chemistry"
      - "entity state"
      - "serialization"

    integration:
      - "physics + matter"
      - "matter + chemistry"
      - "environment + biology"
      - "universe + agent"

    determinism:
      - "same seed -> same result"

    scientific_validation:
      - "known physical behaviors"
      - "known chemical relationships where modeled"

    stress:
      - "large entity counts"
      - "long simulation periods"
      - "large numbers of events"

# ============================================================
# 25. ERROR HANDLING
# ============================================================

reliability:

  requirements:
    - "fail loudly for invalid simulation states"
    - "validate critical numerical values"
    - "detect NaN/Infinity"
    - "prevent corrupted universe state from silently propagating"
    - "checkpoint important simulations"
    - "provide actionable error messages"

# ============================================================
# 26. AI IDE DEVELOPMENT RULES
# ============================================================

ai_ide_rules:

  role: >
    The AI coding agent is an engineering assistant, not the inventor of
    the project's architecture.

  mandatory:
    - "Read this specification before modifying the project."
    - "Do not silently change fundamental architecture."
    - "Do not remove requirements to make implementation easier."
    - "Do not introduce unnecessary frameworks."
    - "Do not create fake implementations presented as complete systems."
    - "Do not use placeholder logic for core physics without clearly labeling it."
    - "Do not hard-code emergent behavior."
    - "Do not make the AI omniscient."
    - "Do not leak hidden universe state directly into the agent."
    - "Document scientifically simplified models."
    - "Keep modules independently testable."
    - "Keep simulation and rendering separate."
    - "Keep simulation and AI separate."
    - "Use the best programming language for each subsystem."

  coding_style:
    - "clear"
    - "professional"
    - "readable"
    - "modular"
    - "not over-engineered"
    - "minimal unnecessary abstraction"
    - "strong naming"
    - "small focused modules"

# ============================================================
# 27. WHAT MUST NOT HAPPEN
# ============================================================

anti_patterns:

  - "Do not make a fake universe consisting only of visual effects."
  - "Do not make every behavior an if/else script."
  - "Do not hard-code intelligence."
  - "Do not make the agent know the universe rules automatically."
  - "Do not make reproduction simply spawn another identical agent."
  - "Do not make evolution a visual animation."
  - "Do not make chemistry a list of arbitrary crafting recipes."
  - "Do not couple rendering to simulation."
  - "Do not couple the universe engine directly to one specific AI model."
  - "Do not assume the LLM is the entire artificial organism."
  - "Do not sacrifice correctness merely for visual quality."
  - "Do not sacrifice architecture merely to produce a quick demo."

# ============================================================
# 28. SCIENTIFIC HONESTY
# ============================================================

scientific_integrity:

  rules:
    - >
      Clearly distinguish real scientific models from approximations.
    - >
      Never claim that a simplified simulation is physically identical
      to the real universe.
    - >
      Record assumptions and approximations.
    - >
      Make constants configurable when appropriate.
    - >
      Validate modeled behavior against known relationships where possible.
    - >
      Treat emergent behavior as an experimental result rather than
      assuming it will occur.

# ============================================================
# 29. SUCCESS CRITERIA FOR THE FIRST UNIVERSE
# ============================================================

success_criteria:

  universe:
    - "starts from a defined seed/state"
    - "advances independently of AI"
    - "has persistent simulation time"
    - "contains physical state"
    - "supports matter"
    - "supports chemistry"
    - "supports environmental state"
    - "supports entities"
    - "can save and restore state"

  simulation:
    - "deterministic mode works"
    - "simulation can run faster/slower than real time"
    - "simulation can be paused and stepped"
    - "important state can be inspected"
    - "tests verify critical systems"

  architecture:
    - "AI can later enter without rewriting the universe engine"
    - "multiple AI agents can eventually inhabit the same world"
    - "future biological/evolutionary systems have defined integration points"
    - "rendering is independent from simulation"
    - "Python AI can communicate with the C++ engine"

# ============================================================
# 30. LONG-TERM EXPERIMENT
# ============================================================

ultimate_experiment:

  question: >
    What kinds of intelligence, behavior, concepts, cooperation,
    technology, adaptation, and evolution can emerge when artificial
    organisms are placed inside a persistent computational universe
    with physics, chemistry, time, environmental constraints, memory,
    learning, communication, reproduction, and evolution?

  important:
    description: >
      The project must not assume the answer. The purpose of the system
      is to create an environment in which the answer can be experimentally
      investigated.

# ============================================================
# 31. CORE PRINCIPLE
# ============================================================

final_principle: >
  Build the universe first as a coherent independent world.
  The AI must eventually live inside the universe, not exist outside it
  controlling it. Give the organism mechanisms and capabilities, but do
  not give it the knowledge that those mechanisms imply. Let interaction,
  observation, memory, experimentation, development, reproduction,
  inheritance, environmental pressure, and time produce the possibility
  of emergent behavior.