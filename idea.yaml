name: Origin
version: 0.6.1-dev
purpose: persistent systemic 3D virtual world for human testing and future LLM-agent experiments
runtime:
  engine: Godot 3.6
  language: GDScript
  authoritative_runtime: observer/godot/scripts/OriginRuntime.gd
  renderer_client: observer/godot/scripts/Main.gd
  required_toolchain: Godot 3.6 only
  native_reference: historical_only
philosophy:
  - world rules over scripted behavior
  - persistence over respawned fakery
  - systemic depth over feature count
  - testability over presentation
  - scalability over premature detail
agent_boundary:
  source_of_truth: Godot runtime
  developer_actor: HumanTester
  developer_controls_separate: true
  unrestricted_developer_powers: false
  normal_agent_capabilities: controlled and validated
